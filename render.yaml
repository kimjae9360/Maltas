services:
  - type: web
    name: aice-simulator-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AICE_API_KEY
        sync: false
      - key: AICE_ALLOWED_ORIGINS
        sync: false
